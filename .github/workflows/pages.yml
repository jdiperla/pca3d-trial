name: Publish PCA3D Trial
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled Trial release
        run: curl --fail --location --retry 3 --output trial-webgl.zip "https://github.com/jdiperla/pca3d-trial/releases/download/v0.76.8-trial/PCA3D-v0.76.8-Trial-WebGL.zip"
      - name: Verify and assemble compiled Trial
        run: python3 assemble.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish browser Trial
        id: deployment
        uses: actions/deploy-pages@v4
